<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; padding: 14px; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    label { font-size: 12px; color: #555; display: block; margin-top: 8px; }
    input[type=text] { width: 100%; padding: 6px; box-sizing: border-box; margin-top: 2px; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    button { margin-top: 12px; width: 100%; padding: 8px; background: #1a73e8; color: white;
             border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .status { font-size: 12px; margin-top: 8px; }
    .ok { color: green; }
    .err { color: #c00; }
    .hint { font-size: 11px; color: #888; margin-top: 10px; line-height: 1.4; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  </style>
</head>
